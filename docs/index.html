<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EEG time-frequency volume</title>
  <style>
    :root { color-scheme: dark; --bg:#071018; --panel:#0e1a25; --line:#284052; --text:#e6f1f8; --muted:#91a7b6; --accent:#4fd1c5; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font:14px/1.35 system-ui,-apple-system,sans-serif; }
    main { display:grid; grid-template-columns:minmax(0,1fr) 300px; min-height:100vh; }
    .stage { position:relative; min-height:620px; overflow:hidden; }
    canvas { width:100%; height:100%; display:block; touch-action:none; }
    aside { background:var(--panel); border-left:1px solid var(--line); padding:18px; overflow:auto; }
    h1 { font-size:18px; font-weight:600; margin:0 0 4px; }
    h2 { font-size:13px; font-weight:600; margin:20px 0 8px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; }
    p { color:var(--muted); margin:0 0 16px; }
    label { display:block; margin:12px 0; }
    .row { display:flex; justify-content:space-between; gap:12px; margin-bottom:4px; }
    output { color:var(--accent); font-variant-numeric:tabular-nums; }
    input[type=range] { width:100%; accent-color:var(--accent); }
    select,button { width:100%; border:1px solid var(--line); background:#142431; color:var(--text); border-radius:7px; padding:8px; }
    button { margin-top:8px; }
    button:hover { border-color:var(--accent); }
    .view-grid { display:grid; grid-template-columns:1fr 1fr; gap:7px; }
    .view-grid button { margin:0; }
    .legend { height:12px; border-radius:6px; background:linear-gradient(90deg,#24164b,#2657a7,#27b9b1,#f4d35e,#e63946); }
    .legend-labels,.hint { display:flex; justify-content:space-between; color:var(--muted); font-size:12px; }
    .badge { position:absolute; left:14px; top:14px; background:rgba(7,16,24,.82); padding:8px 10px; border-radius:7px; color:var(--muted); pointer-events:none; }
    .template-error { position:absolute; inset:0; display:grid; place-items:center; padding:32px; text-align:center; color:var(--text); }
    .template-error div { max-width:560px; }
    .template-error strong { display:block; font-size:20px; margin-bottom:10px; }
    details { margin-top:18px; color:var(--muted); }
    pre { white-space:pre-wrap; overflow-wrap:anywhere; font-size:11px; }
    @media (max-width:760px) { main { grid-template-columns:1fr; } aside { border-left:0; border-top:1px solid var(--line); } .stage { min-height:480px; } }
  </style>
</head>
<body>
<main>
  <section class="stage" aria-label="Interactive EEG channel time frequency volume">
    <canvas id="view"></canvas>
    <div class="badge">Drag to rotate · wheel to zoom · scroll a slider to move its face</div>
  </section>
  <aside>
    <h1>EEG spectral volume</h1>
    <p id="subtitle"></p>
    <label id="eventPageLabel" hidden><span class="row"><span>Published event</span></span><select id="eventPage"></select></label>
    <label><span class="row"><span>Display</span></span><select id="mode"><option value="slices">Dense volume + six faces</option><option value="cloud">Threshold volume</option></select></label>
    <label><span class="row"><span>Interpolation</span></span><select id="interpolation"><option value="cubic" selected>Cubic (default)</option><option value="linear">Linear</option><option value="none">None / native voxels</option></select></label>
    <label id="polarityLabel"><span class="row"><span>Volume polarity</span></span><select id="polarity"><option value="high">Increases</option><option value="low">Decreases</option><option value="both">Both tails</option></select></label>
    <label><span class="row"><span>Channel</span><output id="channelOut"></output></span><input id="channel" type="range" min="0" step="1"></label>
    <label><span class="row"><span>Time start</span><output id="timeStartOut"></output></span><input id="timeStart" type="range" min="0" step="1"></label>
    <label><span class="row"><span>Time end</span><output id="timeOut"></output></span><input id="time" type="range" min="0" step="1"></label>
    <label><span class="row"><span>Time-axis width</span><output id="timeStretchOut">1.0×</output></span><input id="timeStretch" type="range" min="0.5" max="3" value="1" step="0.1"></label>
    <label><span class="row"><span>Frequency low</span><output id="freqStartOut"></output></span><input id="freqStart" type="range" min="0" step="1"></label>
    <label><span class="row"><span>Frequency high</span><output id="freqOut"></output></span><input id="freq" type="range" min="0" step="1"></label>
    <label><span class="row"><span>Scene zoom</span><output id="zoomOut">1.0×</output></span><input id="zoom" type="range" min="0.4" max="3" value="1" step="0.05"></label>
    <label id="opacityLabel"><span class="row"><span>Interior opacity</span><output id="opacityOut">28%</output></span><input id="opacity" type="range" min="0" max="70" value="28" step="1"></label>
    <label id="thresholdLabel"><span class="row"><span>Volume threshold</span><output id="thresholdOut"></output></span><input id="threshold" type="range" min="55" max="98" value="72" step="1"></label>
    <h2>Orient to plane</h2>
    <div class="view-grid">
      <button type="button" data-view="time-frequency">Time × frequency</button>
      <button type="button" data-view="time-channel">Time × channel</button>
      <button type="button" data-view="channel-frequency">Channel × frequency</button>
      <button id="reset" type="button">Perspective</button>
    </div>
    <h2>Color scale</h2>
    <div class="legend"></div><div class="legend-labels"><span id="low"></span><span id="high"></span></div>
    <details><summary>Processing provenance</summary><pre id="metadata"></pre></details>
  </aside>
</main>
