<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EEG time-frequency volume</title>
  <style>
    :root { color-scheme: dark; --bg:#071018; --panel:#0e1a25; --line:#284052; --text:#e6f1f8; --muted:#91a7b6; --accent:#4fd1c5; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font:14px/1.35 system-ui,-apple-system,sans-serif; }
    main { display:grid; grid-template-columns:minmax(0,1fr) 300px; min-height:100vh; }
    .stage { position:relative; min-height:620px; overflow:hidden; }
    canvas { width:100%; height:100%; display:block; touch-action:none; }
    aside { background:var(--panel); border-left:1px solid var(--line); padding:18px; overflow:auto; }
    h1 { font-size:18px; font-weight:600; margin:0 0 4px; }
    h2 { font-size:13px; font-weight:600; margin:20px 0 8px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; }
    p { color:var(--muted); margin:0 0 16px; }
    label { display:block; margin:12px 0; }
    .row { display:flex; justify-content:space-between; gap:12px; margin-bottom:4px; }
    output { color:var(--accent); font-variant-numeric:tabular-nums; }
    input[type=range] { width:100%; accent-color:var(--accent); }
    select,button { width:100%; border:1px solid var(--line); background:#142431; color:var(--text); border-radius:7px; padding:8px; }
    button { margin-top:8px; }
    button:hover { border-color:var(--accent); }
    .view-grid { display:grid; grid-template-columns:1fr 1fr; gap:7px; }
    .view-grid button { margin:0; }
    .legend { height:12px; border-radius:6px; background:linear-gradient(90deg,#24164b,#2657a7,#27b9b1,#f4d35e,#e63946); }
    .legend-labels,.hint { display:flex; justify-content:space-between; color:var(--muted); font-size:12px; }
    .badge { position:absolute; left:14px; top:14px; background:rgba(7,16,24,.82); padding:8px 10px; border-radius:7px; color:var(--muted); pointer-events:none; }
    .template-error { position:absolute; inset:0; display:grid; place-items:center; padding:32px; text-align:center; color:var(--text); }
    .template-error div { max-width:560px; }
    .template-error strong { display:block; font-size:20px; margin-bottom:10px; }
    details { margin-top:18px; color:var(--muted); }
    pre { white-space:pre-wrap; overflow-wrap:anywhere; font-size:11px; }
    @media (max-width:760px) { main { grid-template-columns:1fr; } aside { border-left:0; border-top:1px solid var(--line); } .stage { min-height:480px; } }
  </style>
</head>
<body>
<main>
  <section class="stage" aria-label="Interactive EEG channel time frequency volume">
    <canvas id="view"></canvas>
    <div class="badge">Drag to rotate · wheel to move time · double-click to reset</div>
  </section>
  <aside>
    <h1>EEG spectral volume</h1>
    <p id="subtitle"></p>
    <label id="eventPageLabel" hidden><span class="row"><span>Published event</span></span><select id="eventPage"></select></label>
    <label><span class="row"><span>Display</span></span><select id="mode"><option value="slices">Dense orthogonal slices</option><option value="cloud">Dense threshold volume</option></select></label>
    <label><span class="row"><span>Interpolation</span></span><select id="interpolation"><option value="cubic" selected>Cubic (default)</option><option value="linear">Linear</option><option value="none">None / native voxels</option></select></label>
    <label id="polarityLabel"><span class="row"><span>Volume polarity</span></span><select id="polarity"><option value="high">Increases</option><option value="low">Decreases</option><option value="both">Both tails</option></select></label>
    <label><span class="row"><span>Channel</span><output id="channelOut"></output></span><input id="channel" type="range" min="0" step="1"></label>
    <label><span class="row"><span>Time</span><output id="timeOut"></output></span><input id="time" type="range" min="0" step="1"></label>
    <label><span class="row"><span>Time-axis width</span><output id="timeStretchOut">1.0×</output></span><input id="timeStretch" type="range" min="0.5" max="3" value="1" step="0.1"></label>
    <label><span class="row"><span>Frequency</span><output id="freqOut"></output></span><input id="freq" type="range" min="0" step="1"></label>
    <label id="thresholdLabel"><span class="row"><span>Volume threshold</span><output id="thresholdOut"></output></span><input id="threshold" type="range" min="55" max="98" value="72" step="1"></label>
    <h2>Orient to plane</h2>
    <div class="view-grid">
      <button type="button" data-view="time-frequency">Time × frequency</button>
      <button type="button" data-view="time-channel">Time × channel</button>
      <button type="button" data-view="channel-frequency">Channel × frequency</button>
      <button id="reset" type="button">Perspective</button>
    </div>
    <h2>Color scale</h2>
    <div class="legend"></div><div class="legend-labels"><span id="low"></span><span id="high"></span></div>
    <details><summary>Processing provenance</summary><pre id="metadata"></pre></details>
  </aside>
</main>

function sample(c,f,t,mode){
 if(mode==='none')return native(c,f,t);
 if(mode==='linear'){let c0=Math.floor(c),f0=Math.floor(f),t0=Math.floor(t),cu=c-c0,fu=f-f0,tu=t-t0,v=[];for(let dc=0;dc<2;dc++)for(let df=0;df<2;df++)v.push(lerp(native(c0+dc,f0+df,t0),native(c0+dc,f0+df,t0+1),tu));return clamp(lerp(lerp(v[0],v[1],fu),lerp(v[2],v[3],fu),cu),0,255)}
 let c0=Math.floor(c),f0=Math.floor(f),t0=Math.floor(t),cu=c-c0,fu=f-f0,tu=t-t0,cv=[];
 for(let dc=-1;dc<=2;dc++){let fv=[];for(let df=-1;df<=2;df++){let tv=[];for(let dt=-1;dt<=2;dt++)tv.push(native(c0+dc,f0+df,t0+dt));fv.push(cubic1(tv[0],tv[1],tv[2],tv[3],tu))}cv.push(cubic1(fv[0],fv[1],fv[2],fv[3],fu))}
 return clamp(cubic1(cv[0],cv[1],cv[2],cv[3],cu),0,255);
}
const grids=new Map();
function getGrid(mode){if(grids.has(mode))return grids.get(mode);let C=mode==='none'?NC:Math.min(96,Math.max(64,NC)),F=mode==='none'?NF:Math.min(56,Math.max(48,NF*2)),T=mode==='none'?NT:Math.min(96,Math.max(80,NT)),data=new Uint8Array(C*F*T),gi=(c,f,t)=>(c*F+f)*T+t;for(let c=0;c<C;c++)for(let f=0;f<F;f++)for(let t=0;t<T;t++)data[gi(c,f,t)]=Math.round(sample(c/(C-1)*(NC-1),f/(F-1)*(NF-1),t/(T-1)*(NT-1),mode));let grid={C,F,T,data,idx:gi};grids.set(mode,grid);return grid;}
function quad(list,vertices,q,alpha){let ps=vertices.map(v=>project(...v,canvas.width,canvas.height)),depth=ps.reduce((s,p)=>s+p[2],0)/4;list.push({kind:'quad',depth,ps,q,alpha});}
function draw(){let rect=canvas.getBoundingClientRect(),dpr=Math.min(2,devicePixelRatio||1);if(canvas.width!==Math.round(rect.width*dpr)||canvas.height!==Math.round(rect.height*dpr)){canvas.width=Math.round(rect.width*dpr);canvas.height=Math.round(rect.height*dpr);}let w=canvas.width,h=canvas.height;ctx.fillStyle='#071018';ctx.fillRect(0,0,w,h);let c=+controls.ch.value,t=+controls.t.value,f=+controls.f.value,list=[],g=getGrid(controls.interp.value),G=g.data,gidx=g.idx,gc=Math.round(c/(NC-1)*(g.C-1)),gf=Math.round(f/(NF-1)*(g.F-1)),gt=Math.round(t/(NT-1)*(g.T-1));
 if(controls.mode.value==='slices'){
   let x=t/(NT-1),y=c/(NC-1),z=f/(NF-1);
   for(let ci=0;ci<g.C-1;ci++)for(let fi=0;fi<g.F-1;fi++){let y0=ci/(g.C-1),y1=(ci+1)/(g.C-1),z0=fi/(g.F-1),z1=(fi+1)/(g.F-1);quad(list,[[x,y0,z0],[x,y1,z0],[x,y1,z1],[x,y0,z1]],G[gidx(ci,fi,gt)],.94)}
   for(let ci=0;ci<g.C-1;ci++)for(let ti=0;ti<g.T-1;ti++){let y0=ci/(g.C-1),y1=(ci+1)/(g.C-1),x0=ti/(g.T-1),x1=(ti+1)/(g.T-1);quad(list,[[x0,y0,z],[x1,y0,z],[x1,y1,z],[x0,y1,z]],G[gidx(ci,gf,ti)],.82)}
   for(let fi=0;fi<g.F-1;fi++)for(let ti=0;ti<g.T-1;ti++){let z0=fi/(g.F-1),z1=(fi+1)/(g.F-1),x0=ti/(g.T-1),x1=(ti+1)/(g.T-1);quad(list,[[x0,y,z0],[x1,y,z0],[x1,y,z1],[x0,y,z1]],G[gidx(gc,fi,ti)],.82)}
 } else {
   let threshold=+controls.thr.value/100*255,candidates=[];for(let ci=0;ci<g.C;ci++)for(let fi=0;fi<g.F;fi++)for(let ti=0;ti<g.T;ti++){let q=G[gidx(ci,fi,ti)],keep=controls.polarity.value==='high'?q>=threshold:controls.polarity.value==='low'?q<=255-threshold:(q>=threshold||q<=255-threshold);if(keep)candidates.push([Math.abs(q-127.5),q,ci,fi,ti]);}
   candidates.sort((a,b)=>b[0]-a[0]);for(let v of candidates.slice(0,18000))point(list,v[4]/(g.T-1),v[2]/(g.C-1),v[3]/(g.F-1),v[1],.018,.68);
 }
 list.sort((a,b)=>(a.kind?a.depth:a[0])-(b.kind?b.depth:b[0]));for(let item of list){if(item.kind==='quad'){ctx.fillStyle=color(item.q,item.alpha);ctx.strokeStyle=ctx.fillStyle;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(item.ps[0][0],item.ps[0][1]);for(let i=1;i<4;i++)ctx.lineTo(item.ps[i][0],item.ps[i][1]);ctx.closePath();ctx.fill();ctx.stroke()}else{ctx.fillStyle=color(item[3],item[5]);ctx.fillRect(item[1]-item[4]/2,item[2]-item[4]/2,item[4],item[4])}}drawEventOnset(w,h);box(w,h);drawAxes(w,h);updateText();}
function updateText(){let c=+controls.ch.value,t=+controls.t.value,f=+controls.f.value,isCloud=controls.mode.value==='cloud';document.getElementById('channelOut').textContent=`${channels[c]} (${c+1}/${NC})`;document.getElementById('timeOut').textContent=`${times[t].toFixed(3)} s`;document.getElementById('timeStretchOut').textContent=`${(+controls.timeStretch.value).toFixed(1)}×`;document.getElementById('freqOut').textContent=`${freqs[f].toFixed(1)} Hz`;document.getElementById('thresholdOut').textContent=`${controls.thr.value}% scale`;document.getElementById('thresholdLabel').style.display=isCloud?'block':'none';document.getElementById('polarityLabel').style.display=isCloud?'block':'none';}
for(let el of Object.values(controls))el.addEventListener('input',draw);
canvas.addEventListener('pointerdown',e=>{drag=true;activeView='perspective';lastX=e.clientX;lastY=e.clientY;canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!drag)return;yaw+=(e.clientX-lastX)*.008;pitch=Math.max(-1.35,Math.min(1.35,pitch+(e.clientY-lastY)*.008));lastX=e.clientX;lastY=e.clientY;draw()});canvas.addEventListener('pointerup',()=>drag=false);canvas.addEventListener('wheel',e=>{e.preventDefault();controls.t.value=Math.max(0,Math.min(NT-1,+controls.t.value+Math.sign(e.deltaY)));draw()},{passive:false});canvas.addEventListener('dblclick',()=>{activeView='perspective';yaw=-.62;pitch=.42;draw()});document.getElementById('reset').onclick=()=>{activeView='perspective';yaw=-.62;pitch=.42;controls.ch.value=Math.floor(NC/2);controls.t.value=Math.floor(NT/2);controls.f.value=Math.floor(NF/2);draw()};
document.querySelectorAll('[data-view]').forEach(button=>button.addEventListener('click',()=>{controls.mode.value='slices';activeView=button.dataset.view;if(activeView==='time-frequency'){yaw=0;pitch=-Math.PI/2+.015}else if(activeView==='time-channel'){yaw=0;pitch=0}else{yaw=Math.PI/2;pitch=0}draw()}));
document.getElementById('subtitle').textContent=`${payload.metadata.config.event} · ${payload.metadata.n_epochs_used} epochs · ${NC} channels`;
const eventPages=payload.metadata.public_event_pages||[];
if(eventPages.length){let label=document.getElementById('eventPageLabel'),select=document.getElementById('eventPage');for(let page of eventPages){let option=document.createElement('option');option.value=page.href;option.textContent=page.label;option.selected=page.event===payload.metadata.config.event;select.appendChild(option)}select.addEventListener('change',()=>{window.location.href=select.value});label.hidden=false;}
document.getElementById('low').textContent=payload.volume.low.toPrecision(3);document.getElementById('high').textContent=payload.volume.high.toPrecision(3);document.getElementById('metadata').textContent=JSON.stringify(payload.metadata,null,2);
new ResizeObserver(draw).observe(canvas);draw();
</script>
