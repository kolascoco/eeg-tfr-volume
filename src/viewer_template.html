<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EEG time-frequency volume</title>
  <style>
    :root { color-scheme: dark; --bg:#071018; --panel:#0e1a25; --line:#284052; --text:#e6f1f8; --muted:#91a7b6; --accent:#4fd1c5; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font:14px/1.35 system-ui,-apple-system,sans-serif; }
    main { display:grid; grid-template-columns:minmax(0,1fr) 300px; min-height:100vh; }
    .stage { position:relative; min-height:620px; overflow:hidden; }
    canvas { width:100%; height:100%; display:block; touch-action:none; }
    aside { background:var(--panel); border-left:1px solid var(--line); padding:18px; overflow:auto; }
    h1 { font-size:18px; font-weight:600; margin:0 0 4px; }
    h2 { font-size:13px; font-weight:600; margin:20px 0 8px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; }
    p { color:var(--muted); margin:0 0 16px; }
    label { display:block; margin:12px 0; }
    .row { display:flex; justify-content:space-between; gap:12px; margin-bottom:4px; }
    output { color:var(--accent); font-variant-numeric:tabular-nums; }
    input[type=range] { width:100%; accent-color:var(--accent); }
    select,button { width:100%; border:1px solid var(--line); background:#142431; color:var(--text); border-radius:7px; padding:8px; }
    button { margin-top:8px; }
    button:hover { border-color:var(--accent); }
    .view-grid { display:grid; grid-template-columns:1fr 1fr; gap:7px; }
    .view-grid button { margin:0; }
    .legend { height:12px; border-radius:6px; background:linear-gradient(90deg,#24164b,#2657a7,#27b9b1,#f4d35e,#e63946); }
    .legend-labels,.hint { display:flex; justify-content:space-between; color:var(--muted); font-size:12px; }
    .badge { position:absolute; left:14px; top:14px; background:rgba(7,16,24,.82); padding:8px 10px; border-radius:7px; color:var(--muted); pointer-events:none; }
    .template-error { position:absolute; inset:0; display:grid; place-items:center; padding:32px; text-align:center; color:var(--text); }
    .template-error div { max-width:560px; }
    .template-error strong { display:block; font-size:20px; margin-bottom:10px; }
    details { margin-top:18px; color:var(--muted); }
    pre { white-space:pre-wrap; overflow-wrap:anywhere; font-size:11px; }
    @media (max-width:760px) { main { grid-template-columns:1fr; } aside { border-left:0; border-top:1px solid var(--line); } .stage { min-height:480px; } }
  </style>
</head>
<body>
<main>
  <section class="stage" aria-label="Interactive EEG channel time frequency volume">
    <canvas id="view"></canvas>
    <div class="badge">Drag to rotate · wheel to zoom · scroll a slider to move its face</div>
  </section>
  <aside>
    <h1>EEG spectral volume</h1>
    <p id="subtitle"></p>
    <label id="eventPageLabel" hidden><span class="row"><span>Published event</span></span><select id="eventPage"></select></label>
    <label><span class="row"><span>Display</span></span><select id="mode"><option value="slices">Dense volume + six faces</option><option value="cloud">Threshold volume</option></select></label>
    <label><span class="row"><span>Interpolation</span></span><select id="interpolation"><option value="cubic" selected>Cubic (default)</option><option value="linear">Linear</option><option value="none">None / native voxels</option></select></label>
    <label id="polarityLabel"><span class="row"><span>Threshold direction</span></span><select id="polarity"><option value="high">Positive / increases</option><option value="low">Inverted / decreases</option><option value="both">Both positive + negative</option></select></label>
    <label><span class="row"><span>Channel</span><output id="channelOut"></output></span><input id="channel" type="range" min="0" step="1"></label>
    <label><span class="row"><span>Time start</span><output id="timeStartOut"></output></span><input id="timeStart" type="range" min="0" step="1"></label>
    <label><span class="row"><span>Time end</span><output id="timeOut"></output></span><input id="time" type="range" min="0" step="1"></label>
    <label><span class="row"><span>Time-axis width</span><output id="timeStretchOut">1.0×</output></span><input id="timeStretch" type="range" min="0.5" max="3" value="1" step="0.1"></label>
    <label><span class="row"><span>Frequency low</span><output id="freqStartOut"></output></span><input id="freqStart" type="range" min="0" step="1"></label>
    <label><span class="row"><span>Frequency high</span><output id="freqOut"></output></span><input id="freq" type="range" min="0" step="1"></label>
    <label><span class="row"><span>Scene zoom</span><output id="zoomOut">1.0×</output></span><input id="zoom" type="range" min="0.4" max="3" value="1" step="0.05"></label>
    <label id="opacityLabel"><span class="row"><span>X-ray interior opacity</span><output id="opacityOut">28%</output></span><input id="opacity" type="range" min="0" max="70" value="28" step="1"></label>
    <label id="thresholdLabel"><span class="row"><span>Signal threshold</span><output id="thresholdOut"></output></span><input id="threshold" type="range" min="40" max="98" value="72" step="1"></label>
    <label id="softnessLabel"><span class="row"><span>Temporal threading</span><output id="softnessOut"></output></span><input id="softness" type="range" min="0" max="35" value="12" step="1"></label>
    <h2>Orient to plane</h2>
    <div class="view-grid">
      <button type="button" data-view="time-frequency">Time × frequency</button>
      <button type="button" data-view="time-channel">Time × channel</button>
      <button type="button" data-view="channel-frequency">Channel × frequency</button>
      <button id="reset" type="button">Perspective</button>
    </div>
    <h2>Color scale</h2>
    <div class="legend"></div><div class="legend-labels"><span id="low"></span><span id="high"></span></div>
    <details><summary>Processing provenance</summary><pre id="metadata"></pre></details>
  </aside>
</main>
<script id="payload" type="application/json">$PAYLOAD</script>

   for(let ci=0;ci<=gc;ci++)for(let fi=gf0;fi<=gf1;fi++)for(let ti=gt0;ti<=gt1;ti++){let k=gidx(ci,fi,ti),q=G[k],normalized=q/255,signal=controls.polarity.value==='high'?normalized:controls.polarity.value==='low'?1-normalized:Math.max(normalized,1-normalized),weight;if(threading>0){let u=clamp((signal-(threshold-threading))/threading,0,1);weight=u*u*(3-2*u)}else weight=signal>=threshold?1:0;bridgeWeight[k]=Math.round(weight*255);if(signal>=threshold){coreMask[k]=1;cores.push([signal,q,ci,fi,ti])}}
   let coreStep=Math.max(1,Math.ceil(cores.length/28000));for(let vi=0;vi<cores.length;vi+=coreStep){let v=cores[vi],strength=clamp((v[0]-threshold)/Math.max(.001,1-threshold),0,1);point(list,v[4]/(g.T-1),v[2]/(g.C-1),v[3]/(g.F-1),v[1],.018,.48+.36*strength)}
   let maxGap=threading>0?1+Math.round(threading*32):1,threadCandidates=[];for(let ci=0;ci<=gc;ci++)for(let fi=gf0;fi<=gf1;fi++){let last=-1;for(let ti=gt0;ti<=gt1;ti++)if(coreMask[gidx(ci,fi,ti)]){let gap=ti-last;if(last>=0&&gap>1&&gap<=maxGap){let bridge=255;for(let bt=last;bt<=ti;bt++)bridge=Math.min(bridge,bridgeWeight[gidx(ci,fi,bt)]);if(bridge>0)threadCandidates.push([bridge,G[gidx(ci,fi,ti)],ci,fi,last,ti])}last=ti}}
   let threadStep=Math.max(1,Math.ceil(threadCandidates.length/18000));for(let i=0;i<threadCandidates.length;i+=threadStep){let v=threadCandidates[i],strength=v[0]/255,alpha=.18+.42*strength;thread(list,[v[4]/(g.T-1),v[2]/(g.C-1),v[3]/(g.F-1)],[v[5]/(g.T-1),v[2]/(g.C-1),v[3]/(g.F-1)],v[1],alpha,.75+1.25*strength)}
 }
 let volumePoints=list.filter(item=>!item.kind).sort((a,b)=>a[0]-b[0]),threads=list.filter(item=>item.kind==='thread').sort((a,b)=>a.depth-b.depth),faces=list.filter(item=>item.kind==='quad').sort((a,b)=>a.depth-b.depth);for(let item of faces){ctx.fillStyle=color(item.q,item.alpha);ctx.strokeStyle=ctx.fillStyle;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(item.ps[0][0],item.ps[0][1]);for(let i=1;i<4;i++)ctx.lineTo(item.ps[i][0],item.ps[i][1]);ctx.closePath();ctx.fill();ctx.stroke()}if(controls.mode.value==='cloud')drawStructureOutline(volumePoints,w,h);for(let item of volumePoints){ctx.fillStyle=color(item[3],item[5]);ctx.fillRect(item[1]-item[4]/2,item[2]-item[4]/2,item[4],item[4])}for(let item of threads){ctx.strokeStyle=color(item.q,item.alpha);ctx.lineWidth=item.width*(devicePixelRatio||1);ctx.beginPath();ctx.moveTo(item.p[0],item.p[1]);ctx.lineTo(item.r[0],item.r[1]);ctx.stroke()}drawEventOnset(w,h,...bounds);box(w,h,...bounds);drawAxes(w,h,...bounds);updateText()
}
function updateText(){let c=+controls.ch.value,t0=+controls.t0.value,t=+controls.t.value,f0=+controls.f0.value,f=+controls.f.value,isCloud=controls.mode.value==='cloud',threadSamples=+controls.soft.value===0?1:1+Math.round(+controls.soft.value/100*32);document.getElementById('channelOut').textContent=`${channels[c]} (${c+1}/${NC})`;document.getElementById('timeStartOut').textContent=`${times[t0].toFixed(3)} s`;document.getElementById('timeOut').textContent=`${times[t].toFixed(3)} s`;document.getElementById('timeStretchOut').textContent=`${(+controls.timeStretch.value).toFixed(1)}×`;document.getElementById('freqStartOut').textContent=`${freqs[f0].toFixed(1)} Hz`;document.getElementById('freqOut').textContent=`${freqs[f].toFixed(1)} Hz`;document.getElementById('zoomOut').textContent=`${(+controls.zoom.value).toFixed(2)}×`;document.getElementById('opacityOut').textContent=`${controls.opacity.value}%`;document.getElementById('thresholdOut').textContent=`≥ ${controls.thr.value}% scale`;document.getElementById('softnessOut').textContent=+controls.soft.value===0?'off':`${controls.soft.value}% · ${threadSamples} samples`;document.getElementById('opacityLabel').style.display=isCloud?'none':'block';document.getElementById('thresholdLabel').style.display=isCloud?'block':'none';document.getElementById('softnessLabel').style.display=isCloud?'block':'none';document.getElementById('polarityLabel').style.display=isCloud?'block':'none'}
function enforceBounds(source){if(source===controls.t0&&+controls.t0.value>=+controls.t.value)controls.t0.value=Math.max(0,+controls.t.value-1);if(source===controls.t&&+controls.t.value<=+controls.t0.value)controls.t.value=Math.min(NT-1,+controls.t0.value+1);if(source===controls.f0&&+controls.f0.value>=+controls.f.value)controls.f0.value=Math.max(0,+controls.f.value-1);if(source===controls.f&&+controls.f.value<=+controls.f0.value)controls.f.value=Math.min(NF-1,+controls.f0.value+1)}
for(let el of Object.values(controls))el.addEventListener('input',()=>{enforceBounds(el);draw()});
canvas.addEventListener('pointerdown',e=>{drag=true;activeView='perspective';lastX=e.clientX;lastY=e.clientY;canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!drag)return;yaw+=(e.clientX-lastX)*.008;pitch=Math.max(-1.35,Math.min(1.35,pitch+(e.clientY-lastY)*.008));lastX=e.clientX;lastY=e.clientY;draw()});canvas.addEventListener('pointerup',()=>drag=false);canvas.addEventListener('wheel',e=>{e.preventDefault();controls.zoom.value=clamp(+controls.zoom.value*(e.deltaY>0?.9:1.1),+controls.zoom.min,+controls.zoom.max);draw()},{passive:false});for(let control of [controls.ch,controls.t0,controls.t,controls.f0,controls.f])control.addEventListener('wheel',e=>{e.preventDefault();control.value=clamp(+control.value+Math.sign(e.deltaY),+control.min,+control.max);enforceBounds(control);draw()},{passive:false});canvas.addEventListener('dblclick',()=>{activeView='perspective';yaw=-.62;pitch=.42;controls.zoom.value=1;draw()});document.getElementById('reset').onclick=()=>{activeView='perspective';yaw=-.62;pitch=.42;controls.ch.value=NC-1;controls.t0.value=0;controls.t.value=NT-1;controls.f0.value=0;controls.f.value=NF-1;controls.zoom.value=1;draw()};
document.querySelectorAll('[data-view]').forEach(button=>button.addEventListener('click',()=>{controls.mode.value='slices';activeView=button.dataset.view;if(activeView==='time-frequency'){yaw=0;pitch=0}else if(activeView==='time-channel'){yaw=0;pitch=-Math.PI/2+.015}else{yaw=Math.PI/2;pitch=0}draw()}));
document.getElementById('subtitle').textContent=`${payload.metadata.config.event} · ${payload.metadata.n_epochs_used} epochs · ${NC} channels visualized`;
const eventPages=payload.metadata.public_event_pages||[];
if(eventPages.length){let label=document.getElementById('eventPageLabel'),select=document.getElementById('eventPage');for(let page of eventPages){let option=document.createElement('option');option.value=page.href;option.textContent=page.label;option.selected=page.event===payload.metadata.config.event;select.appendChild(option)}select.addEventListener('change',()=>{window.location.href=select.value});label.hidden=false;}
document.getElementById('low').textContent=payload.volume.low.toPrecision(3);document.getElementById('high').textContent=payload.volume.high.toPrecision(3);document.getElementById('metadata').textContent=JSON.stringify(payload.metadata,null,2);
new ResizeObserver(draw).observe(canvas);draw();
